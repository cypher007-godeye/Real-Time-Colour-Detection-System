<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Color Calibration Tool</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            transition: background-color 0.2s ease;
        }

        #controls {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-bottom: 2px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        input[type="color"] {
            width: 80px;
            height: 80px;
            cursor: pointer;
            border: 3px solid #333;
            border-radius: 10px;
        }

        #info-panel {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }

        .value-box {
            background: #eee;
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            min-width: 120px;
            text-align: center;
        }

        .label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        #display-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
        }

        .fullscreen-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.9rem;
            color: #777;
            background: rgba(255,255,255,0.7);
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="app">
        <div id="controls">
            <div class="control-group">
                <span class="label">Pick Color</span>
                <input type="color" id="colorPicker" value="#ff0000">
            </div>

            <div id="info-panel">
                <div class="control-group">
                    <span class="label">HEX</span>
                    <div id="hexValue" class="value-box">#FF0000</div>
                </div>
                <div class="control-group">
                    <span class="label">RGB</span>
                    <div id="rgbValue" class="value-box">255, 0, 0</div>
                </div>
                <div class="control-group">
                    <span class="label">OpenCV HSV</span>
                    <div id="hsvValue" class="value-box">0, 255, 255</div>
                </div>
            </div>
        </div>

        <div id="display-area">
            <div id="colorName">RED</div>
        </div>
        <div class="fullscreen-hint">Press F11 for Fullscreen</div>
    </div>

    <script>
        const colorPicker = document.getElementById('colorPicker');
        const app = document.getElementById('app');
        const hexDisplay = document.getElementById('hexValue');
        const rgbDisplay = document.getElementById('rgbValue');
        const hsvDisplay = document.getElementById('hsvValue');
        const colorNameDisplay = document.getElementById('colorName');

        function rgbToHsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            const delta = max - min;
            let h = 0;

            if (delta !== 0) {
                if (max === r) h = ((g - b) / delta) % 6;
                else if (max === g) h = ((b - r) / delta) + 2;
                else h = ((r - g) / delta) + 4;
                h = Math.round(h * 60);
                if (h < 0) h += 360;
            }

            const s = max === 0 ? 0 : delta / max;
            const v = max;

            // Convert to OpenCV HSV Format:
            // H: 0-180, S: 0-255, V: 0-255
            const openCVH = Math.round(h / 2);
            const openCVS = Math.round(s * 255);
            const openCVV = Math.round(v * 255);

            return { h: openCVH, s: openCVS, v: openCVV };
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        function updateDisplay() {
            const hex = colorPicker.value;
            const { r, g, b } = hexToRgb(hex);
            const hsv = rgbToHsv(r, g, b);

            // Update Background
            app.style.backgroundColor = hex;

            // Update Text Values
            hexDisplay.textContent = hex.toUpperCase();
            rgbDisplay.textContent = `${r}, ${g}, ${b}`;
            hsvDisplay.textContent = `${hsv.h}, ${hsv.s}, ${hsv.v}`;

            // Update center text to show the current hex (as a label)
            colorNameDisplay.textContent = `HEX: ${hex.toUpperCase()}`;
        }

        colorPicker.addEventListener('input', updateDisplay);

        // Initialize
        updateDisplay();
    </script>
</body>
</html>
